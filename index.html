DOCS.architecture = `# Architecture — Galaxium Travels

## Purpose

Galaxium Travels is a full-stack interplanetary booking system that allows users to search, filter, and book space travel flights between destinations (Earth, Mars, Moon, Venus, Jupiter, Europa, Pluto). It demonstrates modern full-stack development practices with a React frontend and FastAPI backend, supporting type-safe operations and dual protocol support (REST + MCP for AI agents). It is IBM Bob's primary tutorial and demo application.

## Tech Stack

| Layer | Technology | Notes |
|---|---|---|
| **Frontend UI** | React 18 | Component-based SPA with hooks |
| **Frontend Language** | TypeScript | Type-safe frontend development |
| **Frontend Build** | Vite | Fast dev server and production bundling |
| **Frontend Styling** | Tailwind CSS + Framer Motion | Utility-first CSS with animations (starfield) |
| **Frontend HTTP** | Axios | Promise-based HTTP client for API calls |
| **Frontend Routing** | React Router | Client-side navigation between pages |
| **Frontend Notifications** | React Hot Toast | Toast notifications for user feedback |
| **Backend Framework** | FastAPI | Async Python web framework with auto-generated docs |
| **Backend Validation** | Pydantic | Data validation and serialization |
| **Backend ORM** | SQLAlchemy | Object-relational mapper for database operations |
| **Backend AI Protocol** | FastMCP | Model Context Protocol support for AI agents |
| **Backend Server** | Uvicorn | ASGI server for FastAPI |
| **Database** | SQLite | Lightweight file-based SQL database with seed data |
| **Runtime** | Python 3.8+ | Async/await support |

## Key Components

### Frontend

1. **Pages** (\`src/pages/\`)
   - \`Home.tsx\` — Landing page with space-themed hero section
   - \`Flights.tsx\` — Flight search and browse interface with filtering
   - \`MyBookings.tsx\` — User booking history and cancellation management

2. **Components** (\`src/components/\`)
   - **Layout** — \`Header\`, \`Footer\`, \`Layout\` wrapper (navigation and page structure)
   - **Flights** — \`FlightCard\` displays individual flight details with "Book Now" action
   - **Bookings** — \`BookingCard\` shows booking details; \`BookingModal\` handles confirmation flow
   - **User** — \`UserIdentification\` component for name/email login
   - **Common** — Reusable \`Button\`, \`Card\`, \`Input\`, \`Modal\`, \`LoadingSpinner\`, \`Starfield\`

3. **Services & Utilities**
   - \`services/api.ts\` — Axios client wrapping all REST API calls
   - \`types/index.ts\` — TypeScript definitions for User, Flight, Booking entities
   - \`hooks/useUser.tsx\` — Custom hook for user state management (login, logout, persist)
   - \`utils/formatters.ts\` — Date/time, duration, and currency formatting helpers

### Backend

1. **Service Modules** (\`services/\`)
   - \`flight.py\` — \`list_flights()\` retrieves all available flights
   - \`booking.py\` — \`book_flight()\`, \`cancel_booking()\`, \`get_bookings()\` for booking lifecycle
   - \`user.py\` — \`register_user()\` creates new users with email uniqueness check

2. **Database Layer**
   - \`db.py\` — SQLAlchemy session management (\`SessionLocal\`, \`get_db\`), \`init_db()\`
   - \`models.py\` — ORM model definitions (User, Flight, Booking)
   - \`seed.py\` — Pre-populates the database with demo data on startup

3. **Validation Layer** (\`schemas.py\`)
   - \`FlightOut\`, \`BookingOut\`, \`UserOut\` — Response schemas
   - \`BookingRequest\`, \`UserRegistration\` — Input validation schemas
   - \`ErrorResponse\` — Standardized error format

4. **API Server** (\`server.py\`)
   - REST endpoints: \`GET /flights\`, \`POST /book\`, \`GET /bookings/{user_id}\`, \`POST /cancel/{booking_id}\`, \`POST /register\`, \`GET /user\`, \`GET /\`
   - MCP tools: equivalent functions exposed for AI agent protocols via FastMCP
   - CORS middleware for cross-origin requests from the frontend

### Database Models

Three core SQLAlchemy ORM models defined in \`models.py\`:

| Model | Key Fields |
|---|---|
| **User** | \`user_id\` (PK), \`name\`, \`email\` (unique) |
| **Flight** | \`flight_id\` (PK), \`origin\`, \`destination\`, \`departure_time\`, \`arrival_time\`, \`price\`, \`seats_available\` |
| **Booking** | \`booking_id\` (PK), \`user_id\` (FK→User), \`flight_id\` (FK→Flight), \`status\`, \`booking_time\` |

\`\`\`

## Data Flow

### Booking a Flight (Happy Path)

1. **Browse** — User opens \`/flights\`. Frontend calls \`GET /flights\`; backend queries all \`Flight\` rows and returns them as \`FlightOut[]\`.
2. **Identify** — User clicks "Book Now". If no cached user, \`UserIdentification\` component collects name + email and calls \`POST /register\`; backend upserts a \`User\` row and returns \`user_id\`.
3. **Confirm** — \`BookingModal\` shows flight details. User confirms; frontend calls \`POST /book\` with \`{ user_id, flight_id }\`.
4. **Persist** — Backend \`book_flight()\` service validates seats available, creates a \`Booking\` row (status=\`confirmed\`), decrements \`seats_available\` on the \`Flight\` row, and commits the transaction.
5. **Feedback** — Backend returns \`BookingOut\`. Frontend shows a toast notification and the booking appears on \`MyBookings\`.

### Cancellation

1. User opens \`MyBookings\` → frontend calls \`GET /bookings/{user_id}\`.
2. User clicks "Cancel" → frontend calls \`POST /cancel/{booking_id}\`.
3. Backend sets booking \`status=cancelled\` and increments \`seats_available\` on the flight.
4. Frontend updates the booking list in place.
`;

    actor U as User (Browser)

DOCS.setup = `# Setup Guide — Galaxium Travels

Step-by-step first-run guide for the Galaxium Travels interplanetary booking system.

---

## Prerequisites

| Requirement | Minimum Version | Check |
|---|---|---|
| Python | 3.8+ | \`python --version\` |
| Node.js | 18+ | \`node --version\` |
| npm | (bundled with Node) | \`npm --version\` |
| Git | any recent | \`git --version\` |

Download links: [Python](https://www.python.org/downloads/) · [Node.js](https://nodejs.org/) · [Git](https://git-scm.com/)

On **Windows**, ensure Python is added to \`PATH\` during installation.

---

## 1. Clone the Repository

\`\`\`bash
git clone -b bob-learning-path-branch https://github.com/IBM/galaxium-travels
cd galaxium-travels
\`\`\`

The \`-b bob-learning-path-branch\` flag checks out the tutorial branch used with IBM Bob.

---

## 2. Backend Setup

The backend is a **FastAPI** application that runs on port **8080**.

### 2.1 Create a Python virtual environment

**macOS / Linux:**
\`\`\`bash
cd booking_system_backend
python3 -m venv .venv
source .venv/bin/activate
\`\`\`

**Windows:**
\`\`\`bash
cd booking_system_backend
python -m venv .venv
.venv\\Scripts\\activate
\`\`\`

Your prompt should now show \`(.venv)\`.

### 2.2 Install Python dependencies

\`\`\`bash
pip install -r requirements.txt
\`\`\`

Key packages installed: \`fastapi\`, \`uvicorn\`, \`sqlalchemy\`, \`pydantic\`, \`fastmcp\`, \`pytest\`.

### 2.3 Environment variables

No environment file is required for the backend. The SQLite database (\`booking.db\`) is created automatically in the \`booking_system_backend/\` directory on first run and seeded with demo data.

---

## 3. Frontend Setup

The frontend is a **React 18 + TypeScript + Vite** SPA that runs on port **5173**.

### 3.1 Install Node dependencies

Open a **new terminal** from the repo root:

\`\`\`bash
cd booking_system_frontend
npm install
\`\`\`

### 3.2 Configure the API URL

Create (or verify) the \`.env\` file in \`booking_system_frontend/\`:

\`\`\`bash
# macOS / Linux
echo "VITE_API_URL=http://localhost:8080" > .env

# Windows PowerShell
Set-Content .env "VITE_API_URL=http://localhost:8080"
\`\`\`

The file should contain:
\`\`\`env
VITE_API_URL=http://localhost:8080
\`\`\`

If deploying to a remote server, replace \`http://localhost:8080\` with your backend URL.

---

## 4. Run the Application

### Option A — Quick start (recommended)

From the **repo root**:

**macOS / Linux:**
\`\`\`bash
./start.sh
\`\`\`

**Windows:**
\`\`\`bash
start.bat
\`\`\`

The script installs dependencies (if missing), starts the backend on \`:8080\`, and starts the frontend dev server on \`:5173\` in separate terminal windows.

### Option B — Manual start

You need **two terminals** running simultaneously.

**Terminal 1 — Backend:**
\`\`\`bash
cd booking_system_backend
source .venv/bin/activate   # Windows: .venv\\Scripts\\activate
python server.py
\`\`\`

**Terminal 2 — Frontend:**
\`\`\`bash
cd booking_system_frontend
npm run dev
\`\`\`

---

## 5. Verify It Works

Once both servers are running, open these URLs:

| URL | What you should see |
|---|---|
| http://localhost:5173 | Space-themed UI with animated starfield background |
| http://localhost:5173/flights | Grid of sample flights (Earth→Mars, Moon, Venus, etc.) |
| http://localhost:8080 | JSON health-check response from the API |
| http://localhost:8080/docs | Interactive Swagger UI listing all REST endpoints |
| http://localhost:8080/mcp | MCP protocol endpoint (for AI agent use) |

**Quick smoke test:**
1. Open http://localhost:5173/flights
2. Click **"Book Now"** on any flight
3. Enter a name and email (e.g., \`Alice\` / \`alice@example.com\`)
4. Confirm the booking — a toast notification should appear
5. Navigate to **"My Bookings"** — your reservation should be listed

The database is pre-seeded with 10 users, 10 flights, and 20 sample bookings.

---

## Troubleshooting

### Backend won't start

| Symptom | Fix |
|---|---|
| \`python: command not found\` | Install Python 3.8+ and ensure it is on PATH |
| \`ModuleNotFoundError: No module named 'fastapi'\` | Activate the venv: \`source .venv/bin/activate\` then \`pip install -r requirements.txt\` |
| \`Address already in use\` on port 8080 | Kill the conflicting process: \`lsof -i :8080\` (mac/linux) or \`netstat -ano \\| findstr :8080\` (windows), then \`kill <PID>\` |

### Frontend won't start

| Symptom | Fix |
|---|---|
| \`node: command not found\` | Install Node.js 18+ |
| Port 5173 already in use | Kill process on 5173 or run \`npm run dev -- --port 5174\` |
| \`npm ERR! code ENOENT\` | Delete \`node_modules\` and reinstall: \`rm -rf node_modules && npm install\` |

### Connection / data issues

| Symptom | Fix |
|---|---|
| "Failed to fetch" errors in the UI | Confirm backend is running on \`:8080\`; check \`VITE_API_URL\` in \`.env\` |
| CORS error in browser console | Restart backend; verify \`VITE_API_URL\` matches the actual backend address |
| Blank or corrupt data | Delete \`booking.db\` (\`booking_system_backend/booking.db\`) and restart the backend — it will re-seed |

/**
 * Render markdown to HTML, extracting ```mermaid blocks and
 * replacing them with interactive Mermaid wrappers.
 */
function renderMarkdown(mdText) {
  // Split on ```mermaid ... ``` fences
  const parts = mdText.split(/(```mermaid[\s\S]*?```)/g);
  let mermaidIndex = 0;
  const mermaidDefs = [];

  const processedParts = parts.map(part => {
    const match = part.match(/^```mermaid\n([\s\S]*?)\n?```$/);
    if (match) {
      const id = 'mermaid-' + (mermaidIndex++);
      mermaidDefs.push({ id, def: match[1] });
      return `<div class="mermaid-wrapper"><div class="mermaid" id="${id}"></div></div>`;
    }
    return marked.parse(part);
  });

  return { html: processedParts.join(''), mermaidDefs };
}

// Map tab keys → panel ids and doc keys
const TAB_MAP = {
  architecture: { panelId: 'panel-architecture', docKey: 'architecture' },
  diagrams:     { panelId: 'panel-diagrams',     docKey: 'diagrams'     },
  setup:        { panelId: 'panel-setup',         docKey: 'setup'        },
  tasks:        { panelId: 'panel-tasks',         docKey: 'tasks'        },
};

// Track which tabs have been rendered (lazy)
const rendered = {};

async function renderTab(tabKey) {
  if (rendered[tabKey]) return;
  rendered[tabKey] = true;

  const { panelId, docKey } = TAB_MAP[tabKey];
  const panel = document.getElementById(panelId);
  const { html, mermaidDefs } = renderMarkdown(DOCS[docKey]);

  const wrapper = document.createElement('div');
  wrapper.className = 'md';
  wrapper.innerHTML = html;
  panel.appendChild(wrapper);

  // Render any Mermaid diagrams
  if (mermaidDefs.length > 0) {
    for (const { id, def } of mermaidDefs) {
      const el = document.getElementById(id);
      if (!el) continue;
      try {
        const { svg } = await mermaid.render('m-' + id, def);
        el.innerHTML = svg;
      } catch (err) {
        el.innerHTML = `<pre style="color:#f85149;font-size:.8rem;text-align:left">Mermaid render error:\n${err.message}</pre>`;
      }
    }
  }
}

// ─── Tab switching ────────────────────────────────────────────────────────────

const tabBtns = document.querySelectorAll('.tab-btn');
const tabPanels = document.querySelectorAll('.tab-panel');

function activateTab(tabKey) {
  tabBtns.forEach(btn => {
    const active = btn.dataset.tab === tabKey;
    btn.classList.toggle('active', active);
    btn.setAttribute('aria-selected', active);
  });
  tabPanels.forEach(panel => {
    panel.classList.toggle('active', panel.id === TAB_MAP[tabKey].panelId);
  });
  renderTab(tabKey);
  // Update URL hash without scrolling
  history.replaceState(null, '', '#' + tabKey);
}

tabBtns.forEach(btn => {
  btn.addEventListener('click', () => activateTab(btn.dataset.tab));
});

// ─── Initial render ───────────────────────────────────────────────────────────

// Check URL hash for deep-link
const hash = location.hash.slice(1);
const initialTab = TAB_MAP[hash] ? hash : 'architecture';
activateTab(initialTab);
</script>
